# إعدادات نشر «صيدليتي» على Netlify.
#
# ★ بروكسي سيرفر الواتساب: سيرفر الأكواد على http://162.35.126.155
#   (HTTP بلا شهادة SSL)، والمتصفح يمنع صفحة HTTPS من نداء HTTP
#   مباشر (mixed content) — فيفشل إرسال الكود برسالة «تحقق من
#   الإنترنت» مع أن السيرفر يعمل. الحل: تمرير الطلب عبر حافة Netlify
#   بنفس النطاق (HTTPS) ثم تُعاد توجيهه داخلياً إلى السيرفر.
#
#   التطبيق على الويب يستدعي /wa/api/auth/... فيتحول هنا إلى
#   http://162.35.126.155/api/auth/...
[[redirects]]
  from = "/wa/api/*"
  to = "http://162.35.126.155/api/:splat"
  status = 200
  force = false
